name: Update return history

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-returns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch 1y/5y/10y return history
        run: node scripts/fetch-returns.mjs

      - name: Run tests
        run: npm test

      - name: Commit and push data/returns.json if it changed
        run: |
          if git diff --quiet -- data/returns.json; then
            echo "No changes to data/returns.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/returns.json
          git commit -m "Monthly return history refresh"
          git push
